rag:
  enabled: true
  knowledge_dir: data/knowledge
  allowed_extensions:
    - .md
    - .txt
  chunk_size: 800
  chunk_overlap: 120
  top_k: 5
  score_threshold: 0.2

embedding:
  provider: qwen
  api_key_env: DASHSCOPE_API_KEY
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  embedding_model_name: text-embedding-v4
  batch_size: 10
  timeout_seconds: 60

intent_rag:
  enabled: true
  document_path: data/intent/intent_catalog.md
  collection_name: movie_ticket_agent_intents_v3
  top_k: 8
  score_threshold: 0.42
  margin_threshold: 0.04
  # Uses the shared semantic Embedding configuration above by default.
  # Add an `embedding:` block here only when intent retrieval needs a
  # different provider or model from knowledge-document RAG.

retrieval_policy:
  use_rag_for:
    - 业务规则解释
    - 退改签说明
    - 影院服务 FAQ
    - 推荐理由
    - 异常处理话术
    - Agent 工作流说明
    - 动态卡片协议
  never_use_rag_for:
    - 实时座位库存
    - 锁座结果
    - 下单结果
    - 支付状态
    - 出票状态
    - 用户真实订单
    - 用户隐私信息
